<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pennyworth</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <!-- Ecran 1 : l'intention. Visible tant qu'aucun plan n'est charge. -->
    <section id="ecran-intention">
        <h1>Pennyworth</h1>

        <form id="formulaire">
            <input id="intention" type="text" autocomplete="off"
                   placeholder="Que dois-je préparer ?" required>
            <button id="envoyer" type="submit">Demander</button>
        </form>

        <p class="exemple" id="exemple">
            Exemple : prépare l'arrivée de Jean, stagiaire dev, lundi
        </p>
    </section>

    <!-- Ecran 2 : le plan. Cache tant qu'aucun plan n'existe. -->
    <section id="ecran-plan" hidden>
        <h1>Pennyworth</h1>
        <button id="nouvelle-demande" type="button" class="lien-discret">
            Nouvelle demande
        </button>
        <div class="intention-affichee" id="intention-affichee">
            <span class="intention-etiquette">Demande</span>
            <p class="intention-texte"></p>
        </div>

        <div id="reponse-agent"></div>
        <div id="meta"></div>

        <div id="liste-actions"></div>

        <form id="form-ajout" class="barre-ajout">
            <input id="ajout-champ" type="text" autocomplete="off"
                   placeholder="Ajouter une tâche">
            <button id="ajout-bouton" type="submit">Ajouter</button>
        </form>

        <button id="bouton-executer" type="button">
            Exécuter les tâches cochées
        </button>

        <div id="message-execution"></div>

        <a id="lien-journal" class="lien-discret" href="#" target="_blank" rel="noopener">
            Voir le journal
        </a>

        <details class="debug" id="debug-plan">
            <summary>Voir les appels d'outils</summary>
        </details>
    </section>

    <script>
        // --- Etat courant, en memoire ET dans le localStorage du
        // navigateur (voir CLE_STOCKAGE plus bas). Recharger la page relit
        // ce qui y est memorise, et retrouve le meme plan depuis la base. ---
        let planCourant = null;
        let actionsCourantes = [];

        const ecranIntention = document.getElementById("ecran-intention");
        const ecranPlan = document.getElementById("ecran-plan");
        const boutonNouvelleDemande = document.getElementById("nouvelle-demande");

        const formulaire = document.getElementById("formulaire");
        const champ = document.getElementById("intention");
        const bouton = document.getElementById("envoyer");
        const exemple = document.getElementById("exemple");

        const intentionAffichee = document.getElementById("intention-affichee");
        const reponseAgent = document.getElementById("reponse-agent");
        const meta = document.getElementById("meta");
        const listeActions = document.getElementById("liste-actions");
        const formAjout = document.getElementById("form-ajout");
        const ajoutChamp = document.getElementById("ajout-champ");
        const ajoutBouton = document.getElementById("ajout-bouton");
        const boutonExecuter = document.getElementById("bouton-executer");
        const messageExecution = document.getElementById("message-execution");
        const debugPlan = document.getElementById("debug-plan");
        const lienJournal = document.getElementById("lien-journal");

        // Noms d'outils, en francais, pour l'affichage seulement. Le code
        // continue de manipuler le nom technique (outil), jamais celui-ci.
        const LIBELLES_OUTILS = {
            create_employee_record: "Créer la fiche employé",
            create_github_issue: "Créer une tâche GitHub",
            send_message: "Envoyer un message",
            generate_file: "Générer un document",
            create_calendar_event: "Poser un événement de calendrier",
        };

        champ.addEventListener("focus", () => exemple.classList.add("visible"));
        champ.addEventListener("blur", () => exemple.classList.remove("visible"));

        // --- Persistance : le navigateur retient la derniere conversation,
        // sans rien afficher dans l'URL. Pas de numero a connaitre, pas de
        // lien a partager : c'est un outil pour une seule personne. ---
        const CLE_STOCKAGE = "pennyworth_dernier_plan";

        window.addEventListener("DOMContentLoaded", () => {
            const idMemorise = localStorage.getItem(CLE_STOCKAGE);
            if (idMemorise) {
                chargerPlan(Number(idMemorise));
            }
        });

        // Repart sciemment a zero : efface la memoire, revient a l'ecran 1.
        boutonNouvelleDemande.addEventListener("click", () => {
            localStorage.removeItem(CLE_STOCKAGE);
            planCourant = null;
            actionsCourantes = [];
            ecranPlan.hidden = true;
            ecranIntention.hidden = false;
            champ.value = "";
            champ.focus();
        });

        async function chargerPlan(planId) {
            let reponse;
            try {
                reponse = await fetch(`/api/plans/${planId}`);
            } catch (erreur) {
                // Le reseau est coupe (ou le serveur injoignable) au moment
                // ou la page charge un plan memorise : sans ce filet, la
                // page restait muette, sans jamais dire ce qui s'est passe.
                ecranIntention.hidden = true;
                ecranPlan.hidden = false;
                afficherCarteErreur(
                    reponseAgent,
                    "Impossible de contacter le serveur. Verifiez votre connexion et rechargez la page."
                );
                return;
            }
            if (!reponse.ok) {
                // Le plan memorise n'existe plus : on repart de l'ecran 1
                // plutot que d'afficher une erreur bloquante.
                localStorage.removeItem(CLE_STOCKAGE);
                return;
            }
            const donnees = await reponse.json();
            planCourant = planId;
            actionsCourantes = donnees.actions || [];
            afficherEcranPlan(donnees.intention);
            if (donnees.reponse) {
                // Contrairement au streaming (qui remplit reponseAgent au
                // fil du texte recu), ici on relit une reponse deja
                // complete depuis la base : pas besoin de la faire defiler.
                const carte = document.createElement("div");
                carte.className = "carte";
                const pre = document.createElement("pre");
                pre.innerHTML = texteVersHtmlAvecLiens(donnees.reponse);
                carte.appendChild(pre);
                reponseAgent.replaceChildren(carte);
                // Cout et tokens sont enregistres en base des la premiere
                // reponse (voir db.enregistrer_reponse) : un rechargement
                // doit les retrouver, pas juste le texte de la reponse.
                rendreMeta(donnees);
            }
            rendreActions();

            // Observabilite : sans ca, le panneau debug (pourquoi l'agent a
            // fait ca) restait vide apres un rechargement de page, alors
            // que la trace du dernier echange est bien en base (voir
            // db.tracer dans main.py). On la relit et on la reaffiche telle
            // quelle. Best-effort : si ca echoue, le reste de la page (deja
            // affiche ci-dessus) reste utilisable, seul le panneau debug
            // reste vide comme avant ce correctif.
            try {
                const reponseAudit = await fetch(`/api/plans/${planId}/audit`);
                if (reponseAudit.ok) {
                    const audit = await reponseAudit.json();
                    const derniereProposition = [...audit.evenements]
                        .reverse()
                        .find((e) => e.evenement === "PLAN_PROPOSE" && e.details);
                    if (derniereProposition) {
                        afficherTraceComplete(JSON.parse(derniereProposition.details));
                    }

                    // Meme principe pour "pourquoi cette action a echoue" :
                    // le badge "echec a l'execution" seul ne le dit pas, il
                    // fallait ouvrir le journal pour le savoir. On reutilise
                    // le meme audit deja recupere ci-dessus, aucun appel
                    // reseau de plus.
                    for (const evenement of audit.evenements) {
                        if (evenement.evenement === "ACTION_ECHOUEE" && evenement.action_id) {
                            afficherDetailEchec(evenement.action_id, evenement.details);
                        }
                    }
                }
            } catch (erreur) {
                console.warn("Trace non rechargee :", erreur);
            }
        }

        // Ajoute la raison exacte de l'echec directement sur la carte de
        // l'action, plutot que de laisser le badge "echec a l'execution"
        // seul, muet, obliger a ouvrir le journal pour savoir pourquoi.
        function afficherDetailEchec(actionId, detailsJSON) {
            const carte = listeActions.querySelector(`[data-action-id="${actionId}"]`);
            if (!carte) return;
            const contenu = carte.querySelector(".action-contenu");
            if (!contenu || contenu.querySelector(".action-echec")) return;

            let messageErreur = detailsJSON;
            try {
                const objet = JSON.parse(detailsJSON);
                if (objet && objet.erreur) messageErreur = objet.erreur;
            } catch {
                // Pas du JSON : garde le texte brut tel quel.
            }

            const div = document.createElement("div");
            div.className = "action-echec";
            div.textContent = `Échec : ${messageErreur}`;
            contenu.appendChild(div);
        }

        function afficherEcranPlan(intention) {
            ecranIntention.hidden = true;
            ecranPlan.hidden = false;
            intentionAffichee.querySelector(".intention-texte").textContent = intention;
            // planCourant est deja a jour a cet instant, que ce soit
            // depuis "debut" (streaming) ou chargerPlan (rechargement) :
            // les deux l'affectent avant d'appeler cette fonction.
            lienJournal.href = `/journal.html?plan_id=${planCourant}`;
        }

        // Un fetch() qui echoue AVANT meme d'atteindre le serveur (reseau
        // coupe, serveur eteint, DNS...) leve une TypeError dont le message
        // brut ("Failed to fetch", "NetworkError...") est celui du
        // navigateur, en anglais technique, pas comprehensible pour la
        // plupart des utilisateurs. On le traduit ici en une phrase claire,
        // la meme partout dans l'app (voir chargerPlan, qui l'utilisait
        // deja avant que les autres appels ne soient alignes dessus). Les
        // erreurs HTTP (reponse.ok === false) ne passent pas par ici :
        // elles gardent le message du serveur, deja en francais et propre
        // au cas (voir le code appelant, qui lit reponse.json().detail).
        async function fetchAvecMessageClair(url, options) {
            try {
                return await fetch(url, options);
            } catch (erreurReseau) {
                throw new Error(
                    "Impossible de contacter le serveur. Verifiez votre " +
                    "connexion et reessayez."
                );
            }
        }

        // --- Lecture d'un flux SSE : decoupe en evenements JSON un par un.
        // Carte bonus "streaming" : chaque evenement est traite des qu'il
        // arrive, pas apres que la reponse complete soit terminee.
        // Delai d'inactivite : le seul cas de coupure reseau que ni le
        // serveur ni un try/catch classique ne peuvent rattraper. Toutes
        // les autres pannes (cle API absente, Anthropic injoignable,
        // erreur cote SDK...) finissent par un evenement `erreur` explicite
        // emis par src/main.py (_flux), qui remonte comme une exception
        // normale plus bas dans la pile. Mais une coupure SILENCIEUSE entre
        // le navigateur et notre serveur (paquets perdus sans RST, proxy
        // qui coupe sans prevenir) ne fait ni erreur ni fin : lecteur.read()
        // resterait juste en attente indefiniment, le vrai spinner infini
        // que le sujet interdit. Reinitialise a chaque morceau recu : un
        // echange long (plusieurs tours d'outils) qui progresse normalement
        // n'est jamais coupe, seul un vrai silence prolonge l'est.
        const DELAI_INACTIVITE_MS = 45000;

        async function* lireFluxSSE(reponse) {
            const lecteur = reponse.body.getReader();
            const decodeur = new TextDecoder();
            let tampon = "";

            try {
                while (true) {
                    let minuteur;
                    const attenteExpiree = new Promise((_, rejeter) => {
                        minuteur = setTimeout(() => rejeter(new Error(
                            "Aucune reponse du serveur depuis 45 secondes, " +
                            "la connexion semble coupee. Rechargez la page " +
                            "et reessayez."
                        )), DELAI_INACTIVITE_MS);
                    });

                    let resultat;
                    try {
                        resultat = await Promise.race([lecteur.read(), attenteExpiree]);
                    } finally {
                        clearTimeout(minuteur);
                    }

                    const { done, value } = resultat;
                    if (done) break;
                    tampon += decodeur.decode(value, { stream: true });

                    let indexSeparateur;
                    while ((indexSeparateur = tampon.indexOf("\n\n")) !== -1) {
                        const bloc = tampon.slice(0, indexSeparateur);
                        tampon = tampon.slice(indexSeparateur + 2);
                        if (bloc.startsWith("data: ")) {
                            yield JSON.parse(bloc.slice("data: ".length));
                        }
                    }
                }
            } finally {
                // Que la boucle se termine normalement, sur une erreur, ou
                // sur le timeout ci-dessus : ne jamais laisser la requete
                // sous-jacente continuer a tourner en arriere-plan pour rien.
                lecteur.cancel().catch(() => {});
            }
        }

        // --- Envoie une intention et traite le flux au fil de l'eau.
        // Partagee par l'ecran 1 (creation) et la barre d'ajout : seule
        // l'URL et ce qui se passe sur l'evenement "debut" changent.
        async function envoyerEtStreamer(url, intentionTexte) {
            const debut = performance.now();
            const reponse = await fetchAvecMessageClair(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ intention: intentionTexte }),
            });

            if (!reponse.ok) {
                // Erreur avant meme l'ouverture du flux (ex. intention vide).
                const erreur = await reponse.json();
                throw new Error(erreur.detail || "Erreur du serveur");
            }

            // Le panneau debug repart de zero a chaque echange : il montre
            // la trace du dernier appel, pas un historique cumule. Meme
            // chose pour la reponse en texte : si ce nouvel echange n'en
            // produit pas (que des outils), l'ancienne ne doit pas rester
            // affichee comme si elle etait encore d'actualite.
            debugPlan.querySelectorAll(".appel-outil").forEach((n) => n.remove());

            // Pennyworth reflechit : affiche tant que rien de visible n'est
            // encore arrive (avant le premier morceau de texte). Un appel
            // d'outil peut prendre plusieurs secondes avant tout texte.
            reponseAgent.innerHTML = `
                <div class="attente">
                    Pennyworth réfléchit
                    <span class="points"><span></span><span></span><span></span></span>
                </div>`;

            // Le texte de cet echange s'affiche dans sa propre carte, creee
            // au premier morceau recu, remplie ensuite au fil de l'eau.
            let carteReponse = null;
            let dernierAppelEnCours = null;
            let derniereDonneesFin = null;
            // Accumule le texte brut a part : pendant le streaming,
            // carteReponse.textContent suffit (rapide, pas de re-parsing a
            // chaque morceau). A la fin, on relit ce texte complet pour le
            // reafficher une seule fois en version liens-cliquables (voir
            // texteVersHtmlAvecLiens plus bas).
            let texteAccumule = "";

            for await (const evenement of lireFluxSSE(reponse)) {
                switch (evenement.type) {
                    case "debut":
                        planCourant = evenement.plan_id;
                        localStorage.setItem(CLE_STOCKAGE, planCourant);
                        afficherEcranPlan(intentionTexte);
                        listeActions.replaceChildren();
                        actionsCourantes = [];
                        break;

                    case "texte_delta":
                        if (!carteReponse) {
                            carteReponse = document.createElement("pre");
                            reponseAgent.replaceChildren(
                                Object.assign(document.createElement("div"), {
                                    className: "carte",
                                })
                            );
                            reponseAgent.firstChild.appendChild(carteReponse);
                        }
                        texteAccumule += evenement.texte;
                        carteReponse.textContent += evenement.texte;
                        break;

                    case "outil_appel":
                        dernierAppelEnCours = ajouterLigneDebug(
                            evenement.outil, evenement.arguments, null
                        );
                        break;

                    case "outil_resultat":
                        if (dernierAppelEnCours) {
                            remplirLigneDebug(dernierAppelEnCours, evenement);
                            dernierAppelEnCours = null;
                        }
                        break;

                    case "action_proposee":
                        // Une ligne apparait des qu'elle existe, sans
                        // attendre que Claude ait fini tout le plan.
                        actionsCourantes.push(evenement.action);
                        ajouterActionAffichee(evenement.action);
                        break;

                    case "fin":
                        derniereDonneesFin = evenement;
                        break;

                    case "erreur":
                        throw new Error(evenement.message);
                }
            }

            // Si Claude n'a jamais dit un mot (que des outils, aucun
            // texte), l'attente est encore affichee : on la retire.
            if (!carteReponse) {
                reponseAgent.replaceChildren();
            } else {
                // Un seul repassage a la fin, sur le texte complet : plus
                // simple et plus sur que de re-linkifier a chaque morceau
                // recu (une URL peut arriver coupee en deux morceaux).
                carteReponse.innerHTML = texteVersHtmlAvecLiens(texteAccumule);
            }

            const latenceMs = Math.round(performance.now() - debut);
            if (derniereDonneesFin) {
                // Recapitulatif final : on realigne sur ce que le serveur
                // considere definitif, plutot que de faire confiance aux
                // seuls evenements deja recus cote navigateur.
                actionsCourantes = derniereDonneesFin.actions;
                rendreActions();
                rendreMeta(derniereDonneesFin, latenceMs);
                debugPlan.querySelector("summary").textContent =
                    derniereDonneesFin.trace.length
                        ? `Voir les appels d'outils (${derniereDonneesFin.trace.length})`
                        : "Aucun outil appelé";
            }
        }

        // --- Ecran 1 : creation d'un nouveau plan ---
        formulaire.addEventListener("submit", async (evenement) => {
            evenement.preventDefault();
            bouton.disabled = true;
            try {
                await envoyerEtStreamer("/api/plans", champ.value);
            } catch (erreur) {
                ecranIntention.hidden = true;
                ecranPlan.hidden = false;
                afficherCarteErreur(reponseAgent, erreur.message);
            } finally {
                bouton.disabled = false;
            }
        });

        // --- Ecran 2 : relance le meme planificateur sur le plan existant,
        // via la barre d'ajout. C'est aussi par elle qu'on repond a Claude
        // quand il pose une question et attend une precision. ---
        async function envoyerComplement(texte, boutonADesactiver) {
            boutonADesactiver.disabled = true;
            try {
                await envoyerEtStreamer(`/api/plans/${planCourant}/ajouter`, texte);
            } catch (erreur) {
                afficherCarteErreur(messageExecution, erreur.message);
            } finally {
                boutonADesactiver.disabled = false;
            }
        }

        formAjout.addEventListener("submit", async (evenement) => {
            evenement.preventDefault();
            if (!ajoutChamp.value.trim()) return;
            const texte = ajoutChamp.value;
            ajoutChamp.value = "";
            await envoyerComplement(texte, ajoutBouton);
        });

        // --- La liste des actions, cochables ---

        // Reconstruit tout depuis actionsCourantes : utilise au chargement
        // d'un plan existant, et pour le recapitulatif final du streaming.
        function rendreActions() {
            listeActions.replaceChildren();
            for (const action of actionsCourantes) {
                listeActions.appendChild(construireLigneAction(action));
            }
        }

        // Ajoute UNE action a la suite des autres, sans redessiner le
        // reste. C'est cette fonction que le streaming appelle a chaque
        // evenement action_proposee : les lignes apparaissent une par une,
        // pendant que Claude continue a reflechir sur la suite du plan.
        function ajouterActionAffichee(action) {
            listeActions.appendChild(construireLigneAction(action));
        }

        function construireLigneAction(action) {
            const ligne = document.createElement("div");
            ligne.className = "action etat-" + action.etat.toLowerCase();
            // Sert a retrouver cette carte apres une execution, pour la
            // mettre brievement en valeur (voir boutonExecuter plus bas).
            ligne.dataset.actionId = action.id;

            const caseACocher = document.createElement("input");
            caseACocher.type = "checkbox";
            caseACocher.dataset.actionId = action.id;
            // Decochee par defaut : le choix le plus important de l'ecran.
            // Si l'action a deja un etat definitif, la case reflete cet
            // etat et devient non modifiable.
            const decisionsPrises = ["APPROUVEE", "EXECUTEE", "ECHOUEE", "COMPENSEE"];
            caseACocher.checked = decisionsPrises.includes(action.etat);
            caseACocher.disabled = action.etat !== "PROPOSEE";

            const contenu = document.createElement("div");
            contenu.className = "action-contenu";

            const titre = document.createElement("div");
            titre.className = "action-titre";
            titre.textContent =
                `${action.position}. ${LIBELLES_OUTILS[action.outil] || action.outil}`;
            contenu.appendChild(titre);

            const raison = document.createElement("div");
            raison.className = "action-raison";
            raison.textContent = action.raison || "";
            contenu.appendChild(raison);

            const badges = document.createElement("div");
            badges.className = "badges";
            badges.appendChild(creerBadge(
                action.reversible ? "annulable" : "IRRÉVERSIBLE",
                action.reversible ? "" : "badge-irreversible"
            ));
            if (action.origine === "HUMAIN") {
                badges.appendChild(creerBadge("ajoutée par vous", ""));
            }
            if (action.etat === "BLOQUEE") {
                // Le parent direct ne suffit pas a expliquer "pourquoi" sur
                // une cascade a plusieurs niveaux (A refusee, B bloquee,
                // C bloquee parce que B l'est) : on remonte jusqu'a la
                // vraie cause, l'action REFUSEE a l'origine, pas juste le
                // premier maillon de la chaine.
                const positionParent = trouverPosition(action.depends_on);
                const racine = trouverCauseRacine(action.id);
                const texte = racine && racine.id !== action.depends_on
                    ? `bloquée : dépend de l'action ${positionParent} ` +
                      `(refus d'origine : action ${racine.position})`
                    : `bloquée : dépend de l'action ${positionParent}`;
                badges.appendChild(creerBadge(texte, "badge-bloquee"));
            } else if (action.etat === "REFUSEE") {
                badges.appendChild(creerBadge("refusée", "badge-bloquee"));
            } else if (action.etat === "EXECUTEE") {
                badges.appendChild(creerBadge("exécutée", "badge-execute"));
            } else if (action.etat === "ECHOUEE") {
                badges.appendChild(creerBadge("échec à l'exécution", "badge-irreversible"));
            } else if (action.etat === "COMPENSEE") {
                badges.appendChild(creerBadge("annulée (voir le journal)", "badge-bloquee"));
            } else if (action.depends_on) {
                badges.appendChild(creerBadge(
                    `dépend de l'action ${trouverPosition(action.depends_on)}`,
                    ""
                ));
            }
            contenu.appendChild(badges);

            ligne.append(caseACocher, contenu);
            return ligne;
        }

        // Une seule fonction pour toutes les cartes d'erreur : construite
        // avec textContent (jamais innerHTML), donc jamais de risque
        // d'injection HTML, meme si le message vient un jour a contenir du
        // texte que le serveur a lui-meme recopie depuis l'exterieur (une
        // erreur d'API GitHub, par exemple).
        function afficherCarteErreur(conteneur, message) {
            const carte = document.createElement("div");
            carte.className = "carte erreur";
            const pre = document.createElement("pre");
            pre.textContent = message;
            carte.appendChild(pre);
            conteneur.replaceChildren(carte);
        }

        // Le texte de Claude peut contenir de vraies URLs (l'issue GitHub
        // qu'il vient de creer, par exemple) : affiche en <pre>/textContent
        // pur, une URL n'est jamais cliquable. On echappe le texte a la
        // main (jamais innerHTML sur du texte brut venu du modele) puis on
        // entoure seulement les URLs d'un <a>, sur le texte deja echappe.
        function texteVersHtmlAvecLiens(texte) {
            const echappeur = document.createElement("div");
            echappeur.textContent = texte;
            const echappe = echappeur.innerHTML;
            return echappe.replace(
                /(https?:\/\/[^\s<]+)/g,
                (url) => `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`
            );
        }

        function trouverPosition(actionId) {
            const trouvee = actionsCourantes.find((a) => a.id === actionId);
            return trouvee ? trouvee.position : "?";
        }

        // Remonte la chaine de depends_on depuis une action bloquee jusqu'a
        // trouver celle qui est REFUSEE, la vraie cause du blocage en
        // cascade. `vues` protege contre un cycle dans les donnees (ne
        // devrait jamais arriver, cote serveur c'est deja impossible, mais
        // une boucle infinie cote navigateur serait pire qu'une protection
        // en trop).
        function trouverCauseRacine(actionId) {
            const vues = new Set([actionId]);
            let courante = actionsCourantes.find((a) => a.id === actionId);
            while (courante && courante.depends_on && !vues.has(courante.depends_on)) {
                const parent = actionsCourantes.find((a) => a.id === courante.depends_on);
                if (!parent) return null;
                if (parent.etat === "REFUSEE") return parent;
                vues.add(parent.id);
                courante = parent;
            }
            return null;
        }

        function creerBadge(texte, classeSupplementaire) {
            const badge = document.createElement("span");
            badge.className = "badge " + classeSupplementaire;
            badge.textContent = texte;
            return badge;
        }

        // --- Le panneau debug, rempli en direct pendant le streaming ---

        // Affiche un objet {cle: valeur} en petite grille lisible, plutot
        // qu'un JSON.stringify brut sur une seule ligne. Construit via le
        // DOM (jamais innerHTML sur des valeurs qui viennent d'un outil ou
        // de Claude) pour ne rien laisser echapper d'un contenu qu'on n'a
        // pas ecrit nous-memes.
        function remplirCleValeurs(dl, valeurs) {
            dl.replaceChildren();
            const entrees = valeurs && typeof valeurs === "object"
                ? Object.entries(valeurs) : [];
            if (!entrees.length) {
                const vide = document.createElement("span");
                vide.className = "args-vide";
                vide.textContent = "(aucun argument)";
                dl.appendChild(vide);
                return;
            }
            for (const [cle, valeur] of entrees) {
                const dt = document.createElement("dt");
                dt.textContent = cle;
                const dd = document.createElement("dd");
                dd.textContent = typeof valeur === "object" && valeur !== null
                    ? JSON.stringify(valeur) : String(valeur);
                dl.append(dt, dd);
            }
        }

        // Cree une ligne "en cours" des que l'outil est demande, avant
        // meme qu'on connaisse son resultat ou sa duree. Numerotee dans
        // l'ordre d'appel : ca donne a voir la sequence, pas juste un tas
        // de cartes.
        function ajouterLigneDebug(outil, args, resultat) {
            const bloc = document.createElement("div");
            bloc.className = "appel-outil";

            const numero = debugPlan.querySelectorAll(".appel-outil").length + 1;

            const ligne1 = document.createElement("div");
            ligne1.className = "ligne1";
            // outil vient du nom d'outil choisi par le modele : jamais
            // innerHTML sur cette valeur, meme si elle est censee rester
            // dans la liste des outils declares.
            const nom = document.createElement("span");
            const badgeNumero = document.createElement("span");
            badgeNumero.className = "appel-numero";
            badgeNumero.textContent = String(numero);
            nom.append(badgeNumero, document.createTextNode(outil));
            const duree = document.createElement("span");
            duree.className = "duree";
            duree.textContent = "…";
            ligne1.append(nom, duree);

            const argsDl = document.createElement("dl");
            argsDl.className = "cle-valeurs";
            remplirCleValeurs(argsDl, args);

            const resultatDiv = document.createElement("div");
            resultatDiv.className = "resultat";
            resultatDiv.textContent = "en cours…";

            bloc.append(ligne1, argsDl, resultatDiv);
            debugPlan.appendChild(bloc);
            return bloc;
        }

        // Complete la ligne "en cours" une fois le resultat arrive.
        function remplirLigneDebug(bloc, evenementResultat) {
            if (evenementResultat.erreur) bloc.classList.add("en-erreur");
            bloc.querySelector(".duree").textContent = `${evenementResultat.duree_ms} ms`;

            const resultatDiv = bloc.querySelector(".resultat");
            resultatDiv.replaceChildren();

            const etat = document.createElement("span");
            etat.className = "resultat-etat";
            etat.textContent = evenementResultat.erreur ? "échec" : "ok";
            resultatDiv.appendChild(etat);

            const resultatDl = document.createElement("dl");
            resultatDl.className = "cle-valeurs";
            remplirCleValeurs(resultatDl, evenementResultat.resultat);
            resultatDiv.appendChild(resultatDl);
        }

        // Reconstruit le panneau debug d'un coup depuis une trace complete
        // deja connue (relue depuis le journal), par opposition a
        // ajouterLigneDebug/remplirLigneDebug qui le remplissent en direct
        // pendant le streaming. Memes deux fonctions, juste appelees sans
        // etat "en cours" intermediaire puisque tout est deja termine.
        function afficherTraceComplete(trace) {
            debugPlan.querySelectorAll(".appel-outil").forEach((n) => n.remove());
            for (const entree of trace) {
                const bloc = ajouterLigneDebug(entree.outil, entree.arguments, null);
                remplirLigneDebug(bloc, entree);
            }
            debugPlan.querySelector("summary").textContent = trace.length
                ? `Voir les appels d'outils (${trace.length})`
                : "Aucun outil appelé pour ce plan";
        }

        // --- Executer les taches cochees ---
        boutonExecuter.addEventListener("click", async () => {
            boutonExecuter.disabled = true;
            messageExecution.innerHTML = "";

            try {
                const cases = [...listeActions.querySelectorAll(
                    'input[type="checkbox"]:not(:disabled)'
                )];

                // On patch d'abord tous les refus, puis les approbations.
                // Ordre volontaire : un refus doit avoir le temps de
                // bloquer ses dependantes en cascade cote serveur AVANT
                // qu'on tente d'approuver une case cochee qui en ferait
                // partie. Dans l'autre ordre, l'approbation arriverait
                // trop tot et executerait une action qui aurait du etre
                // bloquee.
                const refus = cases.filter((c) => !c.checked);
                const approbations = cases.filter((c) => c.checked);

                async function patcher(uneCase, etat) {
                    const reponse = await fetchAvecMessageClair(
                        `/api/actions/${uneCase.dataset.actionId}`,
                        {
                            method: "PATCH",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ etat }),
                        }
                    );
                    return reponse;
                }

                for (const uneCase of refus) {
                    const reponse = await patcher(uneCase, "REFUSEE");
                    if (!reponse.ok) {
                        const erreur = await reponse.json();
                        throw new Error(erreur.detail || "Erreur d'approbation");
                    }
                }

                // Une action qui vient d'etre bloquee en cascade par un
                // refus ci-dessus renvoie 409 ici : ce n'est pas une
                // panne, c'est le garde-fou qui a fait son travail. On
                // decoche la case a l'ecran, on garde la liste pour le
                // message final, et on continue avec les autres.
                const titresBloques = [];
                for (const uneCase of approbations) {
                    const reponse = await patcher(uneCase, "APPROUVEE");
                    if (reponse.status === 409) {
                        uneCase.checked = false;
                        const titre = uneCase.closest(".action")
                            .querySelector(".action-titre").textContent.trim();
                        titresBloques.push(titre);
                        continue;
                    }
                    if (!reponse.ok) {
                        const erreur = await reponse.json();
                        throw new Error(erreur.detail || "Erreur d'approbation");
                    }
                }

                const executionReponse = await fetchAvecMessageClair(
                    `/api/plans/${planCourant}/execute`,
                    { method: "POST" }
                );
                if (!executionReponse.ok) {
                    const erreur = await executionReponse.json();
                    throw new Error(erreur.detail || "Erreur d'exécution");
                }
                const { resultats } = await executionReponse.json();

                // Retient ce qui vient reellement de se passer (pas ce qui
                // etait deja acquis avant ce clic : deja_execute rejoue un
                // resultat memorise, ca ne merite pas la mise en valeur)
                // pour le montrer sur les cartes une fois qu'elles seront
                // redessinees juste apres.
                const idsReussis = new Set();
                const idsEchoues = new Set();
                for (const r of resultats) {
                    if (r.deja_execute) continue;
                    if (r.etat === "EXECUTEE") idsReussis.add(r.action_id);
                    else if (r.etat === "ECHOUEE") idsEchoues.add(r.action_id);
                }

                // On relit tout depuis la base : c'est la preuve que l'etat
                // affiche n'est jamais invente cote navigateur.
                await chargerPlan(planCourant);

                for (const id of idsReussis) {
                    const carte = listeActions.querySelector(`[data-action-id="${id}"]`);
                    if (carte) carte.classList.add("vient-de-reussir");
                }
                for (const id of idsEchoues) {
                    const carte = listeActions.querySelector(`[data-action-id="${id}"]`);
                    if (carte) carte.classList.add("vient-d-echouer");
                }

                if (titresBloques.length) {
                    afficherCarteErreur(
                        messageExecution,
                        `Non approuvee(s), bloquee(s) par un refus : ${titresBloques.join(", ")}`
                    );
                } else if (resultats.length === 0) {
                    // Aucune action APPROUVEE au moment de l'appel (tout
                    // etait deja tranche avant ce clic) : le dire
                    // clairement plutot que d'afficher "Execution terminee"
                    // comme si quelque chose venait vraiment de se passer.
                    messageExecution.innerHTML =
                        '<div class="carte">Rien à exécuter : aucune action approuvée en attente.</div>';
                } else if (idsEchoues.size && !idsReussis.size) {
                    messageExecution.innerHTML =
                        '<div class="carte erreur"><pre>Exécution terminée, avec au moins un échec. Voir le détail ci-dessus.</pre></div>';
                } else {
                    messageExecution.innerHTML = `
                        <div class="carte carte-succes">
                            <svg class="coche-animee" viewBox="0 0 52 52" width="26" height="26" aria-hidden="true">
                                <circle class="coche-cercle" cx="26" cy="26" r="24"/>
                                <path class="coche-trait" d="M14 27l7 7 17-17"/>
                            </svg>
                            <p>Exécution terminée. Voir le détail ci-dessus.</p>
                        </div>`;
                }
            } catch (erreur) {
                afficherCarteErreur(messageExecution, erreur.message);
            } finally {
                boutonExecuter.disabled = false;
            }
        });

        // --- Meta et debug (identiques a l'ecran 1, reutilises ici) ---
        // latenceMs est optionnel : au rechargement (chargerPlan), on relit
        // un cout et des tokens deja enregistres en base, mais pas la duree
        // de la requete d'origine (jamais persistee, ca n'aurait pas de
        // sens de la deviner). La puce "xxx ms" est alors simplement omise.
        function rendreMeta(donnees, latenceMs) {
            meta.replaceChildren();
            const puces = [
                `plan n°${donnees.plan_id || donnees.id || planCourant}`,
                `${donnees.cout_eur} €`,
                `${donnees.tokens_entree} + ${donnees.tokens_sortie} tokens`,
            ];
            if (latenceMs !== undefined) puces.push(`${latenceMs} ms`);
            for (const texte of puces) {
                meta.appendChild(creerBadge(texte, "puce"));
            }
        }

    </script>
</body>
</html>
