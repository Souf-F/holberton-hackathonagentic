<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pennyworth — Journal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body class="avec-resultat">
    <a id="lien-retour" class="lien-discret" href="/">← Retour au plan</a>
    <h1>Journal</h1>

    <div id="journal" class="journal"></div>

    <script>
        // Tout est relu depuis la base a chaque chargement de la page :
        // rien de ce qui s'affiche ici ne depend d'une variable JS gardee
        // en memoire. Un rechargement en plein test doit montrer le meme
        // journal qu'avant.
        const conteneur = document.getElementById("journal");
        const planId = new URLSearchParams(window.location.search).get("plan_id");

        // Seuls les outils presents cote serveur dans ANNULATEURS savent
        // vraiment s'annuler (voir src/executeur/handlers/__init__.py).
        // Duplique ici juste pour decider d'afficher le bouton : le
        // serveur reste le seul a trancher, un clic sur un outil qu'on
        // aurait oublie d'ajouter ici echouerait juste proprement en 409.
        const OUTILS_ANNULABLES = new Set(["create_github_issue"]);

        // Une seule fonction pour toutes les cartes d'erreur : construite
        // avec textContent (jamais innerHTML), donc jamais de risque
        // d'injection HTML.
        function afficherCarteErreur(message) {
            const carte = document.createElement("div");
            carte.className = "carte erreur";
            const pre = document.createElement("pre");
            pre.textContent = message;
            carte.appendChild(pre);
            conteneur.replaceChildren(carte);
        }

        // Noms d'evenements, en francais, pour l'affichage seulement. Le
        // nom technique reste visible en infobulle (title) pour qui veut
        // le terme exact du code, sans l'imposer a la lecture.
        const LIBELLES_EVENEMENTS = {
            PLAN_CREE: "Plan créé",
            PLAN_PROPOSE: "Plan proposé",
            ACTION_PROPOSEE: "Action proposée",
            ACTION_APPROUVEE: "Action approuvée",
            ACTION_REFUSEE: "Action refusée",
            ACTION_BLOQUEE: "Action bloquée",
            ACTION_EXECUTEE: "Action exécutée",
            ACTION_ECHOUEE: "Échec d'exécution",
            ACTION_COMPENSEE: "Action annulée",
            ANNULATION_ECHOUEE: "Échec de l'annulation",
        };

        chargerJournal();

        async function chargerJournal() {
            if (!planId) {
                afficherCarteErreur(
                    "Aucun plan_id dans l'URL. Exemple : journal.html?plan_id=1"
                );
                return;
            }

            conteneur.innerHTML = `<div class="attente">Chargement du journal
                <span class="points"><span></span><span></span><span></span></span></div>`;

            try {
                // Le journal a besoin des deux : les evenements pour la
                // chronologie, et les actions pour savoir lesquelles sont
                // encore EXECUTEE (et donc annulables) au moment present.
                const [reponseAudit, reponsePlan] = await Promise.all([
                    fetch(`/api/plans/${planId}/audit`),
                    fetch(`/api/plans/${planId}`),
                ]);
                if (!reponseAudit.ok) {
                    const erreur = await reponseAudit.json();
                    throw new Error(erreur.detail || "Erreur du serveur");
                }
                const donnees = await reponseAudit.json();
                const actionsParId = {};
                if (reponsePlan.ok) {
                    const plan = await reponsePlan.json();
                    for (const action of plan.actions || []) {
                        actionsParId[action.id] = action;
                    }
                }
                afficher(donnees.evenements, actionsParId);
            } catch (erreur) {
                afficherCarteErreur(erreur.message);
            }
        }

        async function annuler(actionId, bouton) {
            bouton.disabled = true;
            bouton.textContent = "Annulation...";
            try {
                const reponse = await fetch(`/api/actions/${actionId}/compensate`, {
                    method: "POST",
                });
                if (!reponse.ok) {
                    const erreur = await reponse.json();
                    throw new Error(erreur.detail || "Erreur d'annulation");
                }
                // Recharge tout le journal : c'est la nouvelle entree
                // ACTION_COMPENSEE, ecrite par le serveur, qui doit
                // apparaitre, pas juste ce bouton qui disparait.
                await chargerJournal();
            } catch (erreur) {
                bouton.disabled = false;
                bouton.textContent = "Annuler";
                alert(erreur.message);
            }
        }

        function afficher(evenements, actionsParId) {
            const entete = document.createElement("p");
            entete.className = "exemple visible";
            entete.textContent = `Plan n°${planId} · ${evenements.length} evenement(s)`;

            if (evenements.length === 0) {
                const vide = document.createElement("div");
                vide.className = "carte";
                vide.innerHTML = "<pre>Aucun evenement pour ce plan.</pre>";
                conteneur.replaceChildren(entete, vide);
                return;
            }

            const liste = document.createElement("div");
            liste.className = "chrono";

            for (const evenement of evenements) {
                const ligne = document.createElement("div");
                const classe = classePourEvenement(evenement.evenement);
                ligne.className = "evenement" + (classe ? ` ${classe}` : "");

                const ligne1 = document.createElement("div");
                ligne1.className = "ligne1";
                const nom = document.createElement("span");
                // textContent uniquement : le libelle vient d'une table
                // fixe cote client, mais evenement.evenement (utilise en
                // repli si absent de la table) vient du serveur, jamais
                // via innerHTML.
                nom.textContent = LIBELLES_EVENEMENTS[evenement.evenement] || evenement.evenement;
                nom.title = evenement.evenement;
                const duree = document.createElement("span");
                duree.className = "duree";
                duree.textContent = formaterHorodatage(evenement.horodatage);
                ligne1.append(nom, duree);

                const meta = document.createElement("div");
                meta.className = "args";
                const morceaux = [`acteur : ${evenement.acteur}`];
                if (evenement.action_id) morceaux.push(`action #${evenement.action_id}`);
                meta.textContent = morceaux.join(" · ");

                ligne.append(ligne1, meta);

                // La raison invoquee par l'agent (ou l'humain, via la barre
                // d'ajout) pour cette action precise : c'est la reponse la
                // plus directe a "pourquoi l'agent a fait ca", affichee ici
                // pour ne pas obliger a retourner sur l'ecran du plan.
                const action = actionsParId[evenement.action_id];
                if (action && action.raison) {
                    const raison = document.createElement("div");
                    raison.className = "args";
                    raison.textContent = `raison : ${action.raison}`;
                    ligne.appendChild(raison);
                }

                // Un bouton "Annuler" seulement sur l'evenement EXECUTEE
                // d'une action qui l'est encore (pas deja compensee par un
                // clic precedent, pas rechargee entre-temps dans un autre
                // onglet) et dont l'outil sait vraiment s'annuler.
                if (
                    evenement.evenement === "ACTION_EXECUTEE" &&
                    action && action.etat === "EXECUTEE" &&
                    OUTILS_ANNULABLES.has(action.outil)
                ) {
                    const boutonAnnuler = document.createElement("button");
                    boutonAnnuler.type = "button";
                    boutonAnnuler.className = "bouton-annuler";
                    boutonAnnuler.textContent = "Annuler";
                    boutonAnnuler.addEventListener("click", () => {
                        annuler(evenement.action_id, boutonAnnuler);
                    });
                    ligne.appendChild(boutonAnnuler);
                }

                // PLAN_PROPOSE porte la trace complete des outils consultes
                // (voir db.tracer dans main.py) : un tableau JSON, pas un
                // texte a afficher tel quel. Rendu comme le panneau debug de
                // l'ecran du plan, replie par defaut pour ne pas noyer la
                // chronologie. Les autres evenements passent par
                // afficherDetails (JSON objet -> grille cle/valeur, texte
                // brut sinon).
                if (evenement.evenement === "PLAN_PROPOSE" && evenement.details) {
                    ligne.appendChild(construireTraceRepliable(evenement.details));
                } else if (evenement.details) {
                    ligne.appendChild(afficherDetails(evenement.details));
                }

                liste.appendChild(ligne);
            }

            conteneur.replaceChildren(entete, liste);
        }

        // Construit le meme panneau "appels d'outils" replie que celui de
        // l'ecran du plan (memes classes CSS : .debug/.appel-outil/...),
        // a partir de la trace JSON stockee dans PLAN_PROPOSE.details.
        function construireTraceRepliable(detailsJSON) {
            let trace;
            try {
                trace = JSON.parse(detailsJSON);
            } catch (erreur) {
                // Trace corrompue ou absente (anciennes lignes d'avant ce
                // correctif) : on l'affiche comme du texte brut plutot que
                // de la faire disparaitre en silence.
                const brut = document.createElement("div");
                brut.className = "resultat";
                brut.textContent = detailsJSON;
                return brut;
            }

            const details = document.createElement("details");
            details.className = "debug";
            const resume = document.createElement("summary");
            resume.textContent = trace.length
                ? `Voir les appels d'outils (${trace.length})`
                : "Aucun outil appelé pour ce plan";
            details.appendChild(resume);

            trace.forEach((entree, index) => {
                const bloc = document.createElement("div");
                bloc.className = "appel-outil" + (entree.erreur ? " en-erreur" : "");

                const ligne1 = document.createElement("div");
                ligne1.className = "ligne1";
                const nom = document.createElement("span");
                const badgeNumero = document.createElement("span");
                badgeNumero.className = "appel-numero";
                badgeNumero.textContent = String(index + 1);
                nom.append(badgeNumero, document.createTextNode(entree.outil));
                const duree = document.createElement("span");
                duree.className = "duree";
                duree.textContent = `${entree.duree_ms} ms`;
                ligne1.append(nom, duree);

                const argsDl = document.createElement("dl");
                argsDl.className = "cle-valeurs";
                remplirCleValeursJournal(argsDl, entree.arguments);

                const resultatDiv = document.createElement("div");
                const etat = document.createElement("span");
                etat.className = "resultat-etat";
                etat.textContent = entree.erreur ? "échec" : "ok";
                const resultatDl = document.createElement("dl");
                resultatDl.className = "cle-valeurs";
                remplirCleValeursJournal(resultatDl, entree.resultat);
                resultatDiv.append(etat, resultatDl);

                bloc.append(ligne1, argsDl, resultatDiv);
                details.appendChild(bloc);
            });
            return details;
        }

        // Meme logique que remplirCleValeurs sur l'ecran du plan (voir
        // index.html) : une petite grille cle/valeur plutot qu'un
        // JSON.stringify brut. Dupliquee ici faute de module JS partage
        // entre les deux pages.
        function remplirCleValeursJournal(dl, valeurs) {
            const entrees = valeurs && typeof valeurs === "object"
                ? Object.entries(valeurs) : [];
            if (!entrees.length) {
                const vide = document.createElement("span");
                vide.className = "args-vide";
                vide.textContent = "(aucun argument)";
                dl.appendChild(vide);
                return;
            }
            for (const [cle, valeur] of entrees) {
                const dt = document.createElement("dt");
                dt.textContent = cle;
                const dd = document.createElement("dd");
                dd.textContent = typeof valeur === "object" && valeur !== null
                    ? JSON.stringify(valeur) : String(valeur);
                dl.append(dt, dd);
            }
        }

        // Beaucoup d'evenements ecrivent du JSON dans `details` (resultat
        // d'execution, de compensation...), d'autres une phrase brute (le
        // motif d'un blocage, par exemple). On affiche le premier cas en
        // petite grille cle/valeur, plus lisible ; le second reste du
        // texte simple, tel quel.
        function afficherDetails(texte) {
            let objet = null;
            try {
                const valeur = JSON.parse(texte);
                if (valeur && typeof valeur === "object" && !Array.isArray(valeur)) {
                    objet = valeur;
                }
            } catch {
                // Pas du JSON : une phrase ecrite par le serveur, affichee
                // telle quelle juste apres.
            }

            if (objet) {
                const dl = document.createElement("dl");
                dl.className = "cle-valeurs resultat";
                remplirCleValeursJournal(dl, objet);
                return dl;
            }

            const details = document.createElement("div");
            details.className = "resultat";
            details.textContent = texte;
            return details;
        }

        function classePourEvenement(nom) {
            if (
                nom === "ACTION_REFUSEE" || nom === "ACTION_BLOQUEE" ||
                nom === "ACTION_ECHOUEE" || nom === "ANNULATION_ECHOUEE"
            ) {
                return "en-erreur";
            }
            if (nom === "ACTION_EXECUTEE") return "en-succes";
            if (nom === "ACTION_COMPENSEE") return "en-compense";
            return "";
        }

        // L'horodatage vient du serveur au format ISO sans fuseau
        // (heure locale du serveur, voir src/db.py) : new Date() le
        // relit tel quel, sans conversion, ce qui est exactement ce
        // qu'on veut ici.
        function formaterHorodatage(iso) {
            const date = new Date(iso);
            if (Number.isNaN(date.getTime())) return iso;
            const deux = (n) => String(n).padStart(2, "0");
            return `${deux(date.getDate())}/${deux(date.getMonth() + 1)} ` +
                   `${deux(date.getHours())}:${deux(date.getMinutes())}:${deux(date.getSeconds())}`;
        }
    </script>
</body>
</html>
